[project]
name = "dublin-portsim"
version = "0.1.0"
description = "Dublin Port berth-planning environment, adapted from FineEnvs/PortSimEnv"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
authors = [{ name = "Patrick Dunne" }]

[project.scripts]
dublin-portsim = "dublin_portsim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dublin_portsim*"]

[tool.setuptools.package-data]
dublin_portsim = ["tasks/*.json"]
